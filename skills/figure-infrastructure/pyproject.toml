[project]
name = "sci-figure-infrastructure"
version = "0.1.0"
description = "Publication figure layout and audit adapters bundled as an Agent Skill"
requires-python = ">=3.12,<3.15"
dependencies = [
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<0.15",
  "pillow>=10",
  "pypdf>=5",
  "pymupdf>=1.24,<2.0",
  "textalloc>=1.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/python/figure_layout"]